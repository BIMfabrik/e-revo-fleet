<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>E‑Revo Garage</title>
  <link rel="preconnect" href="https://cdn11.bigcommerce.com" crossorigin>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <a class="brand" href="#" aria-label="E-Revo Garage home">
        <span class="brand-mark">E</span>
        <span><b>REVO</b><small>GARAGE</small></span>
      </a>
      <nav id="carSwitch" class="car-switch" aria-label="Cars and shared garage"></nav>
    </header>

    <main class="garage">
      <section class="car-heading" aria-live="polite">
        <div class="eyebrow">1/16 E‑REVO · <span id="carIndex">01</span></div>
        <h1 id="carName">Blue</h1>
        <div id="carStatus" class="status-line"><span class="status-dot"></span><span>Ready</span></div>
      </section>

      <section id="vehicleViewer" class="viewer" aria-label="Vehicle viewer">
        <div id="imageStage" class="image-stage">
          <img id="carImage" alt="Traxxas 1/16 E-Revo" draggable="false" referrerpolicy="no-referrer" />
          <div id="hotspots" class="hotspots"></div>
        </div>
        <nav id="viewSwitch" class="view-switch" aria-label="Vehicle views"></nav>
        <div class="viewer-note"><span class="crosshair">＋</span> Select a marked area to inspect</div>
      </section>

      <section id="sharedHub" class="shared-hub" hidden aria-label="Shared garage">
        <div class="shared-intro"><div class="eyebrow">SHARED GARAGE</div><h1>Everything else.</h1><p>Spares, batteries, charging gear, radio equipment and procedures shared by all three cars.</p></div>
        <div class="shared-grid">
          <button data-panel="spares" class="shared-card"><span>01</span><strong>Spares</strong><em id="sharedSpareCount">0 parts</em></button>
          <button data-shared-gear="batteries" class="shared-card"><span>02</span><strong>Batteries</strong><em id="batteryCount">0 packs</em></button>
          <button data-shared-gear="chargers" class="shared-card"><span>03</span><strong>Chargers</strong><em id="chargerCount">0 units</em></button>
          <button data-panel="gear" class="shared-card"><span>04</span><strong>Radio & gear</strong><em id="sharedGearCount">0 items</em></button>
          <button data-panel="workflows" class="shared-card shared-card-wide"><span>05</span><strong>Workflows</strong><em id="sharedWorkflowCount">0 procedures</em></button>
        </div>
      </section>

      <nav id="dock" class="dock" aria-label="Vehicle sections">
        <button data-panel="issues"><span class="dock-icon">!</span><span>Issues</span><em id="issueCount">0</em></button>
        <button data-panel="upgrades"><span class="dock-icon">↑</span><span>Upgrades</span><em id="upgradeCount">0</em></button>
        <button data-panel="service"><span class="dock-icon">✓</span><span>Service</span><em id="serviceCount">0</em></button>
      </nav>
    </main>

    <div id="scrim" class="scrim" hidden></div>
    <aside id="drawer" class="drawer" aria-hidden="true">
      <div class="drawer-head">
        <div><div id="drawerEyebrow" class="eyebrow">GARAGE</div><h2 id="drawerTitle">Details</h2></div>
        <button id="closeDrawer" class="icon-btn close-btn" aria-label="Close">×</button>
      </div>
      <div id="drawerBody" class="drawer-body"></div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
