<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>E‑Revo Garage</title>
  <link rel="preconnect" href="https://cdn11.bigcommerce.com" crossorigin>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <a class="brand" href="#" aria-label="E-Revo Garage home">
        <span class="brand-mark">E</span>
        <span><b>REVO</b><small>GARAGE</small></span>
      </a>
      <nav id="carSwitch" class="car-switch" aria-label="Cars"></nav>
      <button id="menuBtn" class="icon-btn" aria-label="Garage information">•••</button>
    </header>

    <main class="garage">
      <section class="car-heading" aria-live="polite">
        <div class="eyebrow">1/16 E‑REVO · <span id="carIndex">01</span></div>
        <h1 id="carName">Blue</h1>
        <div id="carStatus" class="status-line"><span class="status-dot"></span><span>Ready</span></div>
      </section>

      <section class="viewer" aria-label="Vehicle viewer">
        <div id="imageStage" class="image-stage">
          <img id="carImage" alt="Traxxas 1/16 E-Revo" draggable="false" referrerpolicy="no-referrer" />
          <div id="hotspots" class="hotspots"></div>
        </div>
        <nav id="viewSwitch" class="view-switch" aria-label="Vehicle views"></nav>
        <div class="viewer-note"><span class="crosshair">＋</span> Select a marked area to inspect</div>
      </section>

      <nav class="dock" aria-label="Garage sections">
        <button data-panel="issues"><span class="dock-icon">!</span><span>Issues</span><em id="issueCount">0</em></button>
        <button data-panel="spares"><span class="dock-icon">◇</span><span>Spares</span><em id="spareCount">0</em></button>
        <button data-panel="upgrades"><span class="dock-icon">↑</span><span>Upgrades</span><em id="upgradeCount">0</em></button>
        <button data-panel="gear"><span class="dock-icon">⌁</span><span>Gear</span><em id="gearCount">0</em></button>
        <button data-panel="workflows"><span class="dock-icon">→</span><span>Workflows</span><em id="workflowCount"></em></button>
      </nav>
    </main>

    <div id="scrim" class="scrim" hidden></div>
    <aside id="drawer" class="drawer" aria-hidden="true">
      <div class="drawer-head">
        <div><div id="drawerEyebrow" class="eyebrow">GARAGE</div><h2 id="drawerTitle">Details</h2></div>
        <button id="closeDrawer" class="icon-btn close-btn" aria-label="Close">×</button>
      </div>
      <div id="drawerBody" class="drawer-body"></div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
